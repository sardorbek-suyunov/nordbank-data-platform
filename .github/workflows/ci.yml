name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync

      - name: Lint Python
        run: uv run ruff check .

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Lint SQL
        run: uv run python scripts/lint_sql.py

      # Needs no daemon, and catches YAML and interpolation errors before the stack workflow
      # spends minutes discovering them.
      - name: Validate the compose file
        run: |
          make init-env
          docker compose config --quiet
          uv run python scripts/check_env.py

      - name: Unit tests
        run: make test

      # Every bronze test and structural rule is shown failing on a planted fixture. Needs dbt
      # and DuckDB only, so it runs here rather than in the stack.
      - name: Prove the bronze tests and rules can fail
        run: make dbt-prove

  dags:
    name: dags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install the project with Airflow
        run: uv sync --group airflow

      - name: DAG integrity tests
        run: make test-dags

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check specification, ADR and README conventions
        run: python3 scripts/check_docs.py

      # Folded into this job rather than becoming a fifth required check. It reads no
      # database: the dictionary and the contracts are both committed files, so a contract
      # cannot drift from the dictionary inside a commit without this saying so.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync

      - name: Check the contracts against the data dictionary
        run: make contracts-diff CHECK=1

      # DuckDB is pinned once, in the lock; the image installs from files exported from it.
      - name: Check the image's requirement files against the lock
        run: make requirements CHECK=1

      # The bronze models, their properties and the inventory's bronze section are generated
      # from the contracts and committed; a hand edit or an unregenerated contract fails here.
      - name: Check the generated bronze models against the contracts
        run: make dbt-generate CHECK=1

      # The silver models that mirror an entity: the generated ref and agent location models,
      # every such model's properties and the inventory's silver section (specification 008).
      - name: Check the generated silver models against the contracts
        run: make silver-generate CHECK=1
