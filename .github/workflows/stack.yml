name: stack

# No path filters: this is a required check on every pull request, and a required check that
# does not run cannot be satisfied.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  stack:
    name: stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - uses: docker/setup-buildx-action@v3

      - name: Build the Airflow image
        uses: docker/build-push-action@v6
        with:
          context: infra/docker/airflow
          tags: nordbank/airflow:3.3.2
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install the project
        run: uv sync

      - name: Start the stack
        # No .env is created here on purpose: `make up` generates one, which is the clean-clone
        # path acceptance criterion 1 describes. DAG_PROCESSOR_REFRESH_INTERVAL comes from the
        # environment, which compose prefers over the file, so a trigger does not wait a scan.
        # The image was built in the previous step, with a cache; compose must not rebuild it.
        run: SKIP_BUILD=1 DAG_PROCESSOR_REFRESH_INTERVAL=5 make up

      - name: Health probes
        run: make health STRICT=1

      - name: Trigger and verify the health-check DAG
        run: make verify-dag

      # Before the integration tests, because make test-integration now ends in
      # schema-check, which would otherwise run against an empty database.
      - name: Apply the source schema
        run: make schema-apply

      - name: Prove schema-apply is idempotent
        run: |
          make schema-dump OUT=/tmp/schema-before.txt
          make schema-apply
          make schema-dump OUT=/tmp/schema-after.txt
          diff /tmp/schema-before.txt /tmp/schema-after.txt

      # Spec 003 section 11. The anchor is pinned rather than defaulted to the run date,
      # because the committed manifest is compared against this regeneration and an anchor that
      # moved every midnight would fail the comparison daily for a reason that is not a change.
      - name: Seed the ci profile
        env:
          NORDBANK_ENV: ci
          NORDBANK_SEED: "42"
          NORDBANK_ANCHOR_DATE: "2026-09-18"
        run: make seed

      - name: Verify the coherence invariants
        env:
          NORDBANK_ENV: ci
          NORDBANK_ANCHOR_DATE: "2026-09-18"
        run: make seed-verify

      - name: Prove the load is deterministic against the committed manifest
        env:
          NORDBANK_ENV: ci
          NORDBANK_SEED: "42"
          NORDBANK_ANCHOR_DATE: "2026-09-18"
        run: make seed-manifest CHECK=1

      - name: Integration tests
        env:
          NORDBANK_ENV: ci
          NORDBANK_SEED: "42"
          NORDBANK_ANCHOR_DATE: "2026-09-18"
        run: make test-integration

      - name: Collect compose logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt

      - name: Tear down
        if: always()
        run: FORCE=1 make nuke
