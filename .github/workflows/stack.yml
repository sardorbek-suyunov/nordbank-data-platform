name: stack

# No path filters: this is a required check on every pull request, and a required check that
# does not run cannot be satisfied.
on:
  push:
  pull_request:
  workflow_dispatch:

# The deploy job's token needs more; everything else reads the repository and nothing more.
permissions:
  contents: read

jobs:
  stack:
    name: stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Specification 007: CI seeds at the anchor the committed contracts are authored against
      # (ADR 0014, consequence recorded in ADR 0016), because this job ingests, and a history
      # seeded at another anchor fires its scripted drift on days the contracts do not expect.
      NORDBANK_ENV: ci
      NORDBANK_SEED: "42"
      NORDBANK_ANCHOR_DATE: "2026-07-20"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - uses: docker/setup-buildx-action@v3

      - name: Build the Airflow image
        uses: docker/build-push-action@v6
        with:
          context: infra/docker/airflow
          tags: nordbank/airflow:3.3.2
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install the project
        run: uv sync

      - name: Start the stack
        # No .env is created here on purpose: `make up` generates one, which is the clean-clone
        # path acceptance criterion 1 describes. The variables below come from the environment,
        # which compose prefers over the file. DAG_PROCESSOR_REFRESH_INTERVAL: a trigger does
        # not wait a scan. FEED_FIXTURE_DIR and FRANKFURTER_BASE_URL: the FX feed answers from
        # the recorded responses, and the live URL is an unroutable address (TEST-NET-1), so a
        # request that bypassed the recordings would fail loudly rather than reach the internet.
        # The image was built in the previous step, with a cache; compose must not rebuild it.
        env:
          DAG_PROCESSOR_REFRESH_INTERVAL: "5"
          FEED_FIXTURE_DIR: /opt/airflow/tests/fixtures/feeds
          FRANKFURTER_BASE_URL: http://192.0.2.1/v1
        run: SKIP_BUILD=1 make up

      # ADR 0017. The MinIO server comes from a mirror in the owner's namespace. The upstream
      # digest is stated here, not read back from compose, so that editing the pin cannot also
      # edit the check. The mirror's tag is resolved anonymously and its bytes hashed, and the
      # running server's image must be the one pulled by that digest.
      - name: Assert the MinIO server is the upstream release
        run: |
          repo=sardorbek-suyunov/minio
          tag=RELEASE.2025-09-07T16-13-09Z
          upstream=sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)
          served=sha256:$(curl -fsS -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${repo}/manifests/${tag}" | sha256sum | cut -d' ' -f1)
          if [ "${served}" != "${upstream}" ]; then
            echo "ghcr.io/${repo}:${tag} serves ${served}; upstream is ${upstream}" >&2
            exit 1
          fi
          image=$(docker inspect --format '{{.Image}}' "$(docker compose ps -q minio)")
          if ! docker image inspect --format '{{join .RepoDigests "\n"}}' "${image}" \
              | grep -Fx "ghcr.io/${repo}@${upstream}"; then
            echo "the running minio image ${image} was not pulled by ${upstream}" >&2
            exit 1
          fi
          echo "ghcr.io/${repo}:${tag} serves ${upstream}, and the running server was pulled by it"

      - name: Health probes
        run: make health STRICT=1

      - name: Trigger and verify the health-check DAG
        run: make verify-dag

      - name: Apply the source schema
        run: make schema-apply

      - name: Prove schema-apply is idempotent
        run: |
          make schema-dump OUT=/tmp/schema-before.txt
          make schema-apply
          make schema-dump OUT=/tmp/schema-after.txt
          diff /tmp/schema-before.txt /tmp/schema-after.txt

      # 1. Seed at the anchor and run the integration tests. Spec 003 section 11: the anchor is
      # pinned rather than defaulted to the run date, because the committed manifest is
      # compared against this regeneration.
      - name: Seed the ci profile
        run: make seed

      - name: Verify the coherence invariants
        run: make seed-verify

      - name: Prove the load is deterministic against the committed manifest
        run: make seed-manifest CHECK=1

      # They end in schema-check and seed-verify, and they reseed the source, which is why they
      # run before the ingestion rather than after it.
      - name: Integration tests
        run: make test-integration

      # 2. Reseed, so the ingestion reads the history the manifest describes.
      - name: Reseed the ci profile
        run: make seed

      - name: Apply the warehouse schema
        run: make warehouse-apply

      # 3. The window is fixed by coverage (spec 007 section 8): the initial load, an FX weekend,
      # two days with no clearing file, a late file on the last day, a correction, quarantined
      # records and a sanctions snapshot. Not covered here: drift, a second contract version,
      # parking, a failed batch, FRED and a second snapshot, which the local acceptance run
      # exercises.
      - name: Ingest 2026-07-20 to 2026-07-26 through the real DAGs
        run: |
          start=$(date +%s)
          make backfill FROM=2026-07-20 TO=2026-07-26
          elapsed=$(( $(date +%s) - start ))
          echo "backfill: 7 day(s) in ${elapsed} s, $(( elapsed / 7 )) s per ingested day"

      - name: Check the registry against the lake, the vault and the contracts
        run: make ingest-integrity

      # 4. Criterion 4: a copy of a registered file under a new key, and an object under an
      # unregistered batch id. The build below must leave both out of the model.
      - name: Plant objects the registry never registered
        run: make bronze-plant ACTION=plant

      # 5. Every bronze model and test, with nothing silenced.
      - name: Build and test the bronze models
        run: |
          start=$(date +%s)
          make dbt-build
          echo "dbt build: $(( $(date +%s) - start )) s"

      - name: Show the planted objects are in the lake and not in the model
        run: make bronze-plant ACTION=verify

      # 6. The additive drift event fires at the anchor plus twelve days; the expected schema is
      # then the dictionary plus its delta.
      - name: Advance the simulated source through a drift event
        run: make tick-to DATE=2026-08-01

      - name: Check the schema against the dictionary plus the fired drift
        run: make schema-check

      - name: Verify the invariants after the ticks
        run: make seed-verify

      # The documentation site, built from this warehouse, scanned before it can be published.
      # It is uploaded on every run so that a pull request shows what main would publish; only
      # the deploy job, on a push to main, publishes it.
      - name: Generate the documentation site
        run: make dbt-docs

      - name: Scan the site for secrets and vault values, and prove the scan can fail
        run: |
          make docs-scan
          make docs-scan PLANT=1

      - name: Upload the scanned site
        uses: actions/upload-pages-artifact@v3
        with:
          path: data/dbt-docs

      - name: Collect compose logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt

      - name: Tear down
        if: always()
        run: FORCE=1 make nuke

  # Not a required check: it runs only on a push to main, after `stack` has built and scanned
  # the site. The only job whose token can write to Pages, and only through the OIDC token the
  # deploy action exchanges.
  pages:
    name: pages
    needs: stack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy the documentation site
        id: deployment
        uses: actions/deploy-pages@v4
