# Data contract for the detail records of the card processor's clearing file.
#
# Authored against the file specification in contracts/cardnet/README.md. The column line of a
# delivered file is compared with the `record` columns below, in order: a column the file has
# and this contract does not is additive drift, logged and not landed; a column this contract
# has and the file does not, or the same columns in a different order, is breaking, and the
# whole file is quarantined and its batch failed (spec 006 section 5, criterion 5).
#
# `card_reference` is classified identifier and tokenised with the same keyed hash as
# core.cards.card_reference, in the parsed column and in `_raw_payload` alike, so one card
# resolves to one token whichever feed it arrived through (spec 006 section 4).
source_system: cardnet
source_schema: file
entity: settlements
kind: file
contract_version: 1
in_force_from: null
source_of_truth:
  publisher: Nordbank card processor (simulated)
  document: Card processor clearing file, layout 1, contracts/cardnet/README.md
primary_key: [transaction_reference]
format:
  delimiter: ","
  quoting: rfc4180
  encoding: utf-8
  header_record:
    type: H
    fields: [record_type, processor_id, settlement_date, file_sequence, created_at, layout_version]
  column_line: true
  detail_record_type: D
  trailer_record:
    type: T
    fields: [record_type, network, settlement_currency, record_count, amount_total]
  end_record:
    type: Z
    fields: [record_type, detail_record_count]
columns:
- name: record_type
  type: character(1)
  nullable: false
  classification: non-personal
- name: transaction_reference
  type: character varying(40)
  nullable: false
  classification: non-personal
- name: transaction_date
  type: date
  nullable: false
  classification: non-personal
- name: clearing_date
  type: date
  nullable: false
  classification: non-personal
- name: network
  type: character varying(40)
  nullable: false
  classification: non-personal
- name: card_reference
  type: character(12)
  nullable: false
  classification: identifier
- name: masked_pan
  type: character varying(19)
  nullable: false
  classification: non-personal
- name: merchant_category_code
  type: character(4)
  nullable: true
  classification: non-personal
- name: merchant_name
  type: character varying(200)
  nullable: true
  classification: non-personal
- name: presentment
  type: character varying(3)
  nullable: false
  classification: non-personal
- name: settlement_currency
  type: character(3)
  nullable: false
  classification: non-personal
- name: settlement_amount
  type: numeric(18,4)
  nullable: false
  classification: non-personal
- name: settlement_date
  type: date
  nullable: false
  classification: non-personal
  origin: header
- name: file_sequence
  type: integer
  nullable: false
  classification: non-personal
  origin: header
- name: processor_id
  type: character varying(20)
  nullable: false
  classification: non-personal
  origin: header
