# Data contract for core.payments.
#
# Bootstrapped from docs/data_dictionary.md once, then hand-authored. It is not
# regenerated on every run: the dictionary records what the source is, this records
# what the platform has agreed to accept, and the lag between them is what makes
# drift visible at ingest (spec 005 section 2).
#
# `make contracts-diff` reports divergence from the dictionary and names the
# revision this file was pinned to. Bump `contract_version` deliberately, in a
# commit, when the platform decides to accept something new.
#
# Version 2, 2026-09-21. The scheme widened `remittance_reference` from 140 characters to
# 280, which the ingest gate classified as breaking drift and refused: the whole batch was
# quarantined, the batch marked failed, the watermark left where it was, and `make backfill`
# halted naming this entity and this column. A wider free-text field accepts everything the
# narrower one did, so the platform accepts it, and this is the deliberate decision the halt
# asked a person to take. The generator writes thirteen characters into the column at every
# profile, so nothing in the data changes; what changed is the source's declared shape.
#
# `in_force_from` is the business day the widening fired in the acceptance history, which is
# seeded at `ACCEPTANCE_ANCHOR` in generator/drift/timeline.py: 2026-07-20 plus the event's
# thirty-seven days. The drift timeline is relative to the anchor and this date is absolute, so
# it is correct for that anchor and no other; a unit test asserts the two agree. Version 1 is
# under history/, and a batch for a day before this one is validated against it.
source_system: corebank
source_schema: core
entity: payments
contract_version: 2
watermark_column: updated_at
primary_key: payment_id
dictionary_revision: sha256:e5d088874e5b22e7
in_force_from: 2026-08-26
