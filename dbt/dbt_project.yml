# The platform's dbt project (spec 007). One profile, one target; see profiles.yml.
name: nordbank
version: "1.0"
config-version: 2
profile: nordbank

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
target-path: target
clean-targets: [target, logs]

# No usage statistics: dbt would otherwise send an event to its publisher on every invocation,
# and nothing in this platform calls an external service it does not need.
flags:
  send_anonymous_usage_stats: false

# Two structural rules checked before anything runs, so a violation fails the build rather
# than a review (macros/bronze_guard.sql): a bronze model reads the lake only through the
# registered-batch macro, and no test stores its failures. The hook renders no SQL and holds
# no credential.
on-run-start:
  - "{{ bronze_guard() }}"

models:
  nordbank:
    bronze:
      +materialized: view
      +schema: bronze
    # Silver is tables rebuilt in full (specification 008 section 10; incremental is M6's
    # decision). Every model's contract is enforced: its properties declare every column and
    # type, generated from the contracts where it mirrors an entity, and a model whose SQL
    # returns anything else fails to build rather than drifting from its documentation.
    silver:
      +materialized: table
      +schema: silver
      +contract:
        enforced: true

# The one seed, the band edges silver generalises quasi-identifiers by (specification 008
# section 8), lives beside the silver models it feeds.
seeds:
  nordbank:
    +schema: silver
