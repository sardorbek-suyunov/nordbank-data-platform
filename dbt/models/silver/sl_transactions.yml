# Generated by scripts/silver_generate.py from the contracts; do not edit.
version: 2
models:
  - name: sl_transactions
    description: "Silver transactions, from `br_corebank__transactions` (contracts/corebank/transactions.yml). One row per entity, its latest observation; a soft-deleted entity is absent. Re-reads of one version collapse to the earliest batch. Grain: `transaction_id`."
    config:
      meta:
        entity: transactions
        history: latest_state
        upstream: br_corebank__transactions
        grain: [transaction_id]
        excluded: []
        generated_sql: false
    data_tests:
      - silver_unique_key:
          arguments:
            columns: [transaction_id]
          config:
            severity: error
      - silver_not_null:
          arguments:
            columns: [transaction_id]
          config:
            severity: error
      - silver_min_rows:
          arguments:
            minimum: 25000
          config:
            severity: error
      - silver_rereads_agree:
          arguments:
            upstream: ref('br_corebank__transactions')
            key: [transaction_id]
          config:
            severity: error
      - silver_fx_provenance:
          arguments:
            key: transaction_id
            amount: transaction_amount
            currency: transaction_currency_code
          config:
            severity: error
    columns:
      - name: transaction_id
        data_type: BIGINT
        description: "Surrogate primary key. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
      - name: transaction_reference
        data_type: VARCHAR
        description: "Reference the transaction is known by outside the platform. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
      - name: account_id
        data_type: BIGINT
        description: "Foreign key to core.accounts.account_id, which resolves to the people who hold the account. A pseudonymous key: retained unchanged, never tokenised. Classification: `pseudonymous_key` (a key to a person-bearing entity, retained unchanged)."
        config:
          meta:
            classification: pseudonymous_key
        data_tests:
          - silver_resolves_one_version:
              arguments:
                to: ref('sl_accounts')
                to_column: account_id
                at: "booked_at"
              config:
                severity: error
      - name: card_id
        data_type: BIGINT
        description: "Foreign key to core.cards.card_id, which resolves through the account to a person. A pseudonymous key: retained unchanged, never tokenised. Classification: `pseudonymous_key` (a key to a person-bearing entity, retained unchanged)."
        config:
          meta:
            classification: pseudonymous_key
        data_tests:
          - silver_resolves_one_version:
              arguments:
                to: ref('sl_cards')
                to_column: card_id
                at: "booked_at"
              config:
                severity: error
      - name: merchant_id
        data_type: BIGINT
        description: "The merchant, where there is one. Null for cash and transfers. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
        data_tests:
          - silver_resolves_one_version:
              arguments:
                to: ref('sl_merchants')
                to_column: merchant_id
                at: "booked_at"
              config:
                severity: error
      - name: agent_location_id
        data_type: BIGINT
        description: "The partner location, for a cash-in or cash-out. Null otherwise. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
        data_tests:
          - silver_resolves_one_version:
              arguments:
                to: ref('sl_agent_locations')
                to_column: agent_location_id
                at: "booked_at"
              config:
                severity: error
      - name: transaction_type_code
        data_type: VARCHAR
        description: "What kind of transaction this is. The customer-initiated flag is derived from this through ref.transaction_types, not from a list held in code. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
        data_tests:
          - silver_resolves_one_version:
              arguments:
                to: ref('sl_transaction_types')
                to_column: code
                at: "booked_at"
              config:
                severity: error
      - name: channel_code
        data_type: VARCHAR
        description: "The channel the transaction came through. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
        data_tests:
          - silver_resolves_one_version:
              arguments:
                to: ref('sl_channels')
                to_column: code
                at: "booked_at"
              config:
                severity: error
      - name: transaction_status_code
        data_type: VARCHAR
        description: "Current status. Posted and settled are the statuses that count as posted. `reversed` means this authorisation was voided before it posted, so it never moved money and has no ledger entries; a transaction that did post is undone by a separate reversing row carrying `reversal_of_transaction_id`, not by changing this column. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
        data_tests:
          - silver_resolves_one_version:
              arguments:
                to: ref('sl_transaction_statuses')
                to_column: code
                at: "booked_at"
              config:
                severity: error
      - name: authorisation_outcome_code
        data_type: VARCHAR
        description: "Outcome of the card authorisation. Null for anything not authorised through the card rails. Closed value list, enforced by a check constraint: approved, declined_funds, declined_fraud, referred, timeout. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
      - name: booked_at
        data_type: TIMESTAMP WITH TIME ZONE
        description: "When the transaction hit the account. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
      - name: value_date
        data_type: DATE
        description: "The date the transaction takes effect for interest, which can differ from the booking date. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
      - name: transaction_amount
        data_type: DECIMAL(18,4)
        description: "Amount in the transaction currency, signed by direction. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
      - name: transaction_currency_code
        data_type: VARCHAR
        description: "Currency of transaction_amount. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
        data_tests:
          - silver_resolves_one_version:
              arguments:
                to: ref('sl_currencies')
                to_column: code
                at: "booked_at"
              config:
                severity: error
      - name: is_card_present
        data_type: BOOLEAN
        description: "Whether the card was physically presented. Decided per card authorisation, not derived from the channel: a mobile wallet tap at a terminal is card present and an ecommerce purchase from the same handset is not. Null exactly when card_id is null, because presentment is meaningless without a card authorisation. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
      - name: reversal_of_transaction_id
        data_type: BIGINT
        description: "The transaction this one reverses. Null unless this is a reversal, and never itself. Both rows stay posted and both reach the ledger, on the two dates they were recognised; the pair nets to zero. Not to be confused with `transaction_status_code = 'reversed'`, which is a voided authorisation that never posted. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
      - name: counterparty_reference
        data_type: VARCHAR
        description: "Counterparty account or descriptor as the scheme sent it. Classified identifier because it can carry an IBAN. Holds a token, 32 lowercase hexadecimal characters of a keyed hash of the cleartext, never the cleartext; the token resolves only through the vault. Classification: `identifier` (tokenised at extraction)."
        config:
          meta:
            classification: identifier
      - name: created_at
        data_type: TIMESTAMP WITH TIME ZONE
        description: "When the row was inserted. An audit column: no business timestamp may take this name. Classification: `non-personal` (no restriction). In silver, the value of the latest observation."
        config:
          meta:
            classification: non-personal
      - name: updated_at
        data_type: TIMESTAMP WITH TIME ZONE
        description: "When the row last changed, set by the core.set_updated_at trigger and never by application code. The watermark the extraction layer reads. Classification: `non-personal` (no restriction). In silver, the value of the latest observation."
        config:
          meta:
            classification: non-personal
      - name: _batch_id
        data_type: VARCHAR
        description: "The earliest batch that read the observation which is the entity's latest: re-reads of one version collapse to it. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
      - name: transaction_amount_eur
        data_type: DECIMAL(18,4)
        description: "`transaction_amount` in EUR: divided by the latest rate published at or before the business instant, in exact integer arithmetic, rounded half away from zero to four places. The amount itself for EUR; null when no rate was published before the instant, never zero and never the original amount. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
      - name: fx_rate
        data_type: DECIMAL(18,8)
        description: "The rate converted at, in currency per euro; 1 for EUR; null when missing. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
      - name: fx_rate_date
        data_type: DATE
        description: "The date of the rate converted at. Null for EUR and when missing. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
      - name: fx_is_carried
        data_type: BOOLEAN
        description: "The rate's date is not the business instant's UTC date: carried across a weekend or a holiday, or from the day before when the fact precedes the day's publication. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
      - name: fx_is_missing
        data_type: BOOLEAN
        description: "No rate for the currency was published at or before the business instant. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
      - name: fx_is_provisional
        data_type: BOOLEAN
        description: "The rate's date is the feed's latest publication date, across every currency, and the business instant is after the publication instant of the next weekday after it: the next publication has not landed, and a rebuild may restate this row. Once a later publication has landed the conversion is final, whether or not it carries the currency. Never true for EUR or a missing rate. Classification: `non-personal` (no restriction)."
        config:
          meta:
            classification: non-personal
