# Local stack for the Nordbank platform (spec 001).
#
# Memory limits are deliberate and measured: 5632 MiB across the long-running services, set
# from observed usage rather than guessed, so the stack is validated at a documented floor
# instead of at whatever the developer machine happens to have. The scheduler keeps the largest
# share because LocalExecutor runs tasks inside it, and dbt and pyarrow arrive at M4. The floor
# is re-measured at every milestone that adds runtime work; see docs/runbook.md.
# `mem_limit` is used rather than `deploy.resources`, which is swarm-scoped.
#
# The MinIO images are pinned by tag and digest because those repositories have already moved
# registry once; everything else is pinned by tag.

x-airflow-common: &airflow-common
  build:
    context: ./infra/docker/airflow
    dockerfile: Dockerfile
  image: nordbank/airflow:3.3.2
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__PLUGINS_FOLDER: /opt/airflow/plugins
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_AIRFLOW_USER}:${POSTGRES_AIRFLOW_PASSWORD}@postgres-airflow:5432/${POSTGRES_AIRFLOW_DB}
    AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_WEB_PORT}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: ${DAG_PROCESSOR_REFRESH_INTERVAL:-30}
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: ${DAG_PROCESSOR_REFRESH_INTERVAL:-30}
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME}
    AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME}
    AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}
    AIRFLOW_CONN_NORDBANK_SOURCE_DB: ${AIRFLOW_CONN_NORDBANK_SOURCE_DB}
    # ops_source_tick only. The simulation stands in for the source system's own
    # operation; the platform's extraction path stays on the SELECT-only connection above.
    AIRFLOW_CONN_NORDBANK_SOURCE_SIMULATOR: ${AIRFLOW_CONN_NORDBANK_SOURCE_SIMULATOR}
    AIRFLOW_CONN_NORDBANK_LAKE: ${AIRFLOW_CONN_NORDBANK_LAKE}
    DUCKDB_PATH: ${DUCKDB_PATH}
    LAKE_BUCKET: ${LAKE_BUCKET}
    NORDBANK_ENV: ${NORDBANK_ENV}
    # Extraction, from M4. The salt is the key material for identifier tokenisation and can
    # never be rotated without re-tokenising all history (ADR 0005).
    EXTRACT_LAG_MINUTES: ${EXTRACT_LAG_MINUTES}
    PII_TOKEN_SALT: ${PII_TOKEN_SALT}
    PYTHONPATH: /opt/airflow/plugins:/opt/airflow
    TZ: UTC
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/plugins:/opt/airflow/plugins:ro
    - ./airflow/tests:/opt/airflow/tests:ro
    - ./scripts:/opt/airflow/scripts:ro
    # ops_source_tick runs the mutation engine, which lives in the generator package.
    - ./generator:/opt/airflow/generator:ro
    # The schema drift test compares the live database against docs/data_dictionary.md, and
    # `make test-integration` runs it in here.
    - ./docs:/opt/airflow/docs:ro
    # The extraction tasks read the data contracts, and `make warehouse-apply` applies the
    # warehouse DDL from inside here, because the warehouse file is on a named volume and is
    # not reachable from the host.
    - ./contracts:/opt/airflow/contracts:ro
    - ./infra/warehouse:/opt/airflow/infra/warehouse:ro
    - ./pyproject.toml:/opt/airflow/pyproject.toml:ro
    - airflow-logs:/opt/airflow/logs
    - warehouse:/opt/warehouse
  user: "${AIRFLOW_UID:-50000}:0"

services:
  postgres-source:
    image: postgres:16.15
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_SOURCE_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SOURCE_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_SOURCE_DB}
      SOURCE_APP_USER: ${SOURCE_APP_USER}
      SOURCE_APP_PASSWORD: ${SOURCE_APP_PASSWORD}
      SOURCE_READ_USER: ${SOURCE_READ_USER}
      SOURCE_READ_PASSWORD: ${SOURCE_READ_PASSWORD}
      TZ: UTC
    volumes:
      - ./infra/docker/postgres-source/init:/docker-entrypoint-initdb.d:ro
      # Applied by `make schema-apply`, not by the entrypoint: the DDL is re-appliable and the
      # entrypoint runs only once, on an empty volume.
      - ./infra/docker/postgres-source/schema:/schema:ro
      - ./infra/docker/postgres-source/seed:/seed:ro
      - postgres-source-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_SOURCE_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-airflow:
    image: postgres:16.15
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_AIRFLOW_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AIRFLOW_DB}
      TZ: UTC
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_AIRFLOW_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    mem_limit: 512m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: UTC
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot. No healthcheck: it exits as soon as its work is done, so there is nothing to
  # poll. Its contract is exit 0, consumed through service_completed_successfully.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    mem_limit: 256m
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      LAKE_BUCKET: ${LAKE_BUCKET}
    volumes:
      - ./infra/docker/minio/init.sh:/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy

  # One-shot, see minio-init.
  airflow-init:
    <<: *airflow-common
    restart: "no"
    mem_limit: 1g
    entrypoint: ["/bin/bash", "/opt/airflow/init.sh"]
    depends_on:
      postgres-airflow:
        condition: service_healthy
      postgres-source:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  airflow-apiserver:
    <<: *airflow-common
    restart: unless-stopped
    mem_limit: 1024m
    command: api-server
    ports:
      - "${AIRFLOW_WEB_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped
    mem_limit: 2g
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    restart: unless-stopped
    mem_limit: 512m
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    restart: unless-stopped
    mem_limit: 512m
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-source-data:
  postgres-airflow-data:
  minio-data:
  airflow-logs:
  warehouse:
