# Generator parameters, spec 003 section 2.
#
# This file is the single source of every tunable number in the generator. No distribution
# parameter is inline in generator code, and no generator branches on the profile name: a
# profile is read, not tested for.
#
# docs/generator_realism.md justifies each number and states what is deliberately unrealistic.
# The values under `bands` are contracts that spec 003 invariants and acceptance criteria are
# written against, so they also appear in that document for a reader to review. A document that
# stated no bands could not be reviewed for whether its bands are sensible, which is its whole
# purpose, so the duplication is unavoidable — and scripts/check_docs.py, which the `docs` CI
# job runs, fails if the two disagree. One source per fact, and a mechanical check where two
# representations are unavoidable (docs/specs/README.md).

version: 1

# Shared by every profile. A profile overrides only what genuinely differs, so a distribution
# that works at one scale and not another is visible as an override rather than hidden.
defaults:

  acquisition:
    # A quarter of the book predates the history window. A bank that starts from zero customers
    # on the first day of its history has no early cohort to retain, and Q2 measures nothing.
    initial_customer_share: 0.25
    # Compound monthly growth in the acquisition rate, so cohorts differ in size and Q1's
    # month-over-month growth measure is a trend rather than noise around zero.
    monthly_growth_rate: 0.012
    # Acquisition is seasonal too, on the same December peak and August trough as spending.
    seasonality_weight: 0.35

  customers:
    # Age at signup. Invariant 10 requires 18 at first account opening; the floor is 19 so the
    # invariant is testing the generator rather than restating a constant it was given.
    age_at_signup_min: 19
    age_at_signup_max: 78
    age_at_signup_mode: 33
    # Share carrying each optional contact detail. Real books are not fully populated, and
    # nullable columns that are never null teach the ingestion layer nothing.
    email_share: 0.97
    phone_share: 0.88
    national_identifier_share: 0.72
    # KYC status mix. Verified dominates; the rest exercise the downstream filters.
    kyc_status_mix:
      verified: 0.91
      pending: 0.03
      review: 0.035
      rejected: 0.015
      expired: 0.01
    # Residence country mix. Germany-weighted, every country an EEA state, because the bank is
    # EU-licensed and passports into these markets.
    country_mix:
      "DE": 0.320
      "FR": 0.125
      "NL": 0.095
      "ES": 0.085
      "IT": 0.075
      "AT": 0.048
      "BE": 0.047
      "PL": 0.040
      "IE": 0.035
      "PT": 0.030
      "SE": 0.030
      "FI": 0.020
      "DK": 0.020
      "EE": 0.010
      "LT": 0.010
      "LV": 0.005
      "NO": 0.005
    # Risk band mix at onboarding, ordered A (lowest risk) to E.
    risk_band_mix:
      A: 0.20
      B: 0.31
      C: 0.28
      D: 0.15
      E: 0.06
    # A correspondence address in addition to the residential one.
    correspondence_address_share: 0.18

  accounts:
    # Accounts per customer. Most hold one current account; a minority add savings.
    count_weights:
      1: 0.62
      2: 0.29
      3: 0.09
    type_mix:
      current_personal: 0.58
      savings_instant: 0.22
      current_business: 0.09
      savings_notice: 0.11
    # Joint accounts, which is what makes bridge_account_holder and the ownership weighting
    # more than a formality: counting people and splitting money diverge only when this is
    # non-zero.
    joint_share: 0.14
    # An authorised signatory holds no ownership, so ownership_weight is null for them. The
    # share is of joint accounts, not of all accounts.
    signatory_share: 0.07
    # Accounts denominated other than in EUR. Predominantly EUR by design.
    non_eur_share: 0.11
    non_eur_mix:
      GBP: 0.26
      USD: 0.22
      CHF: 0.14
      SEK: 0.12
      DKK: 0.09
      NOK: 0.08
      PLN: 0.07
      JPY: 0.02
    overdraft_share: 0.31
    overdraft_limit_choices: [250, 500, 1000, 1500, 2500, 5000]
    # The starting balance an account carries when it opens, before any movement. Log-normal in
    # EUR; the fold in invariant 4 reconciles the closing balance to this plus the movements.
    opening_balance_mu: 6.8
    opening_balance_sigma: 1.1

  cards:
    # Share of deposit accounts that carry a card. Savings accounts mostly do not.
    share_by_product_class:
      current: 0.94
      savings: 0.06
    product_mix:
      dbt_cons_cl: 0.54
      dbt_cons_pr: 0.11
      crd_cons_cl: 0.19
      crd_cons_gd: 0.07
      ppd_cons: 0.04
      dbt_comm: 0.035
      crd_comm: 0.015
    validity_years: 4
    # A card is reissued as a new row rather than updated, so a share of cards reach one of the
    # terminal statuses during the history.
    #
    # `expired` is deliberately absent. Expiry is a function of the expiry date and is derived
    # from it, not drawn: a card whose status said `expired` while its expiry date was years
    # away is incoherent, and measured at `ci` every one of the 33 such cards had a future
    # expiry date. A four-year validity over a six-month history means no card expires at `ci`
    # or `dev`, which is the honest answer rather than a status nothing in the data supports.
    status_mix:
      active: 0.892
      replaced: 0.054
      blocked: 0.027
      cancelled: 0.027

  merchants:
    # Merchants per thousand customers, so the ratio holds across profiles rather than the
    # count. A fixed merchant count would make full-profile customers share a tiny catalogue.
    per_thousand_customers: 240
    # Non-EEA merchants are held to a few percent, deliberately. Q4 can only price intra-EEA
    # consumer volume — the outbound inter-regional interchange rate is null and stays null,
    # see metric_definitions.md — so this share is the bounded null exposure of Q4, not an
    # estimate of a real card book's geography. Recorded as unrealistic in the realism document.
    non_eea_share: 0.04
    non_eea_mix:
      "GB": 0.30
      "US": 0.24
      "CH": 0.15
      "TR": 0.06
      "JP": 0.05
      "SG": 0.04
      "CA": 0.04
      "AE": 0.04
      "AU": 0.03
      "IN": 0.02
      "BR": 0.02
      "MX": 0.01
    # Merchant names are dirty by design (spec 002): a share carry casing, punctuation and
    # trailing location noise, so conformance in silver has something real to do.
    dirty_name_share: 0.42
    mcc_mix:
      "5411": 0.155
      "5814": 0.094
      "5812": 0.088
      "5541": 0.062
      "5999": 0.060
      "5912": 0.055
      "5651": 0.050
      "5732": 0.046
      "5967": 0.044
      "4899": 0.040
      "5499": 0.038
      "4121": 0.036
      "4111": 0.034
      "7011": 0.031
      "5542": 0.030
      "4511": 0.028
      "5941": 0.026
      "7994": 0.022
      "6012": 0.021
      "8398": 0.017
      "9399": 0.013
      "6011": 0.010

  agent_locations:
    per_thousand_customers: 6

  transactions:
    # Customer-initiated transactions per active account per month, before seasonality and
    # growth. Tuned against the profile transaction bands in spec 003 section 1.
    per_account_month: 17.5
    # A savings account is not a current account and does not behave like one. Without
    # this split every savings account spends like a current account, drains, and
    # declines for funds, because no salary reaches it.
    per_account_month_by_product_class:
      current: 20.5
      savings: 2.2
      loan: 1.0
      card_settlement: 0.5
      internal: 0.2
    per_account_month_dispersion: 0.45
    # Hour-of-day is bimodal: a lunchtime peak and a larger evening one, over a low overnight
    # floor. Weights are relative, normalised at use.
    hour_weights:
      [0.22, 0.14, 0.09, 0.07, 0.07, 0.11, 0.28, 0.62, 1.05, 1.22, 1.31, 1.58,
       1.86, 1.64, 1.38, 1.35, 1.49, 1.78, 2.10, 2.04, 1.72, 1.24, 0.78, 0.41]
    # Monthly seasonality, January to December. December peaks, August troughs.
    month_weights:
      [0.94, 0.88, 0.97, 0.99, 1.02, 1.04, 1.06, 0.83, 1.00, 1.03, 1.08, 1.31]
    weekend_volume_factor: 0.82
    # The weekday-to-weekend shift in category mix: multipliers applied to an MCC band's weight
    # at the weekend. Groceries and dining rise, government and commuting fall.
    weekend_band_factors:
      supermarket: 1.24
      travel: 1.31
      standard: 1.00
      fuel: 1.12
      cash: 1.08
      charity: 0.95
      government: 0.22
    # The mix of transaction types among customer-initiated movements.
    type_mix:
      card_purchase: 0.694
      atm_withdrawal: 0.071
      direct_debit: 0.058
      standing_order: 0.040
      transfer_out: 0.047
      transfer_in: 0.043
      agent_deposit: 0.021
      agent_withdrawal: 0.014
      card_refund: 0.012
    # Bank-initiated postings, as a rate per account per month rather than a share of the mix,
    # because they post whether the customer transacts or not.
    bank_initiated_per_account_month:
      account_fee: 1.0
      interest_posting: 0.34
      maintenance_fee: 0.08
      fx_markup: 0.21
      card_issue_fee: 0.01
      chargeback_adjustment: 0.004
    # Authorisation outcomes for card transactions. A decline for funds is decided by the
    # balance fold rather than drawn, so this mix covers the rest.
    authorisation_mix:
      approved: 0.9735
      declined_fraud: 0.0071
      referred: 0.0104
      timeout: 0.0090
    # Posted is the default; the rest exercise the status vocabulary and the is_posted flag
    # that invariant 4 reads.
    status_mix:
      posted: 0.9427
      settled: 0.0380
      pending: 0.0075
      authorised: 0.0062
      reversed: 0.0056
    # Card not present rises across the history, linearly from start to end of the window.
    card_not_present_share_start: 0.31
    card_not_present_share_end: 0.52
    # A mobile wallet tap at a terminal is card present, so the channel does not decide
    # presentment. These are the shares of card transactions that are card present, given the
    # channel, and they are what stops presentment collapsing into a channel lookup.
    card_present_share_by_channel:
      pos: 0.985
      mobile_app: 0.640
      atm: 1.000
      agent: 1.000
      ecommerce: 0.004
      web: 0.010
      api: 0.020
    # Channels available to each transaction type, and the mix within it. A flat channel mix
    # would put ATM withdrawals on the web.
    channel_mix_by_type:
      card_purchase:    {pos: 0.523, ecommerce: 0.281, mobile_app: 0.196}
      card_refund:      {pos: 0.402, ecommerce: 0.598}
      atm_withdrawal:   {atm: 1.0}
      agent_withdrawal: {agent: 1.0}
      agent_deposit:    {agent: 1.0}
      transfer_out:     {mobile_app: 0.612, web: 0.318, api: 0.070}
      transfer_in:      {api: 0.560, mobile_app: 0.284, web: 0.156}
      standing_order:   {api: 1.0}
      direct_debit:     {api: 1.0}
    # Everything the bank initiates posts through the same internal channel.
    bank_initiated_channel: api
    # Money coming in. Without a regular credit the book drains: the first smoke run put
    # 31 percent of card authorisations into declined_funds, which is not a bank with
    # tight customers, it is a generator with no income side.
    #
    # A current account receives a salary. A savings account receives a standing transfer
    # from one, which is smaller and is why the two are separate numbers rather than one
    # applied to every account.
    regular_credit_share_by_product_class:
      current: 0.88
      savings: 0.74
    regular_credit_mu_by_product_class:
      current: 7.6
      savings: 5.7
    regular_credit_sigma: 0.52

    # Value date lags the booking date for a minority of movements.
    value_date_lag_share: 0.17
    value_date_lag_days_max: 2

  amounts:
    # Log-normal per MCC band, in the account currency's major units. mu and sigma are of
    # the underlying normal, so the median is exp(mu) and the spread in orders of
    # magnitude is sigma / ln(10).
    #
    # The sigmas were widened after the first smoke run. The originals put 68 percent of
    # general retail purchases between 9 and 74 euro, which is not what a card book looks
    # like: a card is used for a 2 euro coffee and an 800 euro laptop in the same week.
    # The change is made on that ground. It also moves the first-digit distribution
    # closer to Benford, because a wider spread in log space is what produces Benford,
    # but it is not made for that reason and the before-and-after figures are reported in
    # docs/generator_realism.md so a reader can judge which way round it was.
    #
    # Fuel stays narrow deliberately. A tank of fuel costs what a tank of fuel costs, and
    # widening it to help a statistic would be exactly the tuning this note exists to
    # rule out.
    by_band:
      supermarket: {mu: 3.32, sigma: 1.05, min: 1.50, max: 900}
      standard:    {mu: 3.26, sigma: 1.45, min: 0.80, max: 6000}
      fuel:        {mu: 4.03, sigma: 0.52, min: 8.00, max: 400}
      travel:      {mu: 4.61, sigma: 1.35, min: 4.00, max: 9000}
      charity:     {mu: 2.94, sigma: 0.95, min: 2.00, max: 1500}
      government:  {mu: 3.85, sigma: 1.15, min: 3.00, max: 4000}
      cash:        {mu: 4.34, sigma: 0.62, min: 10.00, max: 1000}
    # Cash withdrawals cluster on note multiples rather than landing anywhere. This is the
    # largest single departure from Benford and the reason invariant 14 excludes cash.
    cash_multiples: [10, 20, 50]
    cash_multiple_weights: [0.24, 0.53, 0.23]
    # Transfers and direct debits are not merchant purchases and take their own distribution.
    transfer_mu: 4.42
    transfer_sigma: 1.18
    # Recurring payments repeat the same amount on the same day of month. Excluded from the
    # Benford population for the same reason as cash.
    recurring_share: 0.083
    recurring_amount_choices:
      [4.99, 7.99, 9.99, 11.99, 12.99, 14.99, 17.99, 19.99, 24.99, 29.99,
       34.99, 39.99, 49.99, 59.99, 79.99, 99.00, 120.00, 250.00, 450.00]
    # Bank-initiated postings are small and fixed by product rather than drawn from a shape.
    fee_amount_choices: [1.50, 2.50, 3.90, 4.90, 6.90, 9.90]
    fx_markup_rate: 0.0175

  payments:
    per_account_month: 2.9
    per_account_month_dispersion: 0.55
    type_mix:
      sepa_transfer_out: 0.318
      sepa_transfer_in: 0.246
      sepa_instant_out: 0.144
      sepa_instant_in: 0.089
      sepa_direct_debit: 0.083
      standing_order: 0.049
      swift_transfer_out: 0.036
      swift_transfer_in: 0.023
      scheme_return: 0.008
      scheme_recall: 0.004
    status_mix:
      settled: 0.9106
      booked: 0.0431
      rejected: 0.0203
      pending: 0.0106
      cancelled: 0.0084
      returned: 0.0043
      initiated: 0.0027
    # Cross-border means the counterparty country differs from the account's country, per the
    # cross-border rule in metric_definitions.md.
    cross_border_share: 0.213
    # Corridors are directional and are never netted, so this is the destination mix for a
    # cross-border payment leaving an account in a given country.
    corridor_mix:
      "DE": 0.17
      "FR": 0.12
      "NL": 0.10
      "ES": 0.09
      "IT": 0.08
      "PL": 0.07
      "AT": 0.05
      "BE": 0.05
      "IE": 0.04
      "PT": 0.04
      "SE": 0.04
      "GB": 0.06
      "CH": 0.04
      "US": 0.03
      "TR": 0.01
      "NO": 0.01
    amount_mu: 4.88
    amount_sigma: 1.31
    settlement_lag_days_max: 3
    # Which scheme carries each payment type. ref.payment_schemes is a separate vocabulary from
    # ref.payment_types, and the pairing is a fact about the product rather than a draw.
    scheme_by_type:
      sepa_transfer_out: sepa_ct
      sepa_transfer_in: sepa_ct
      sepa_instant_out: sepa_inst
      sepa_instant_in: sepa_inst
      sepa_direct_debit: sepa_dd
      standing_order: sepa_ct
      swift_transfer_out: swift
      swift_transfer_in: swift
      scheme_return: sepa_ct
      scheme_recall: sepa_ct
    remittance_reference_share: 0.63
    # The share of counterparty names drawn from generator/fixtures/screening_positives.csv,
    # so that sanctions screening at M4 has something to match. The fixture is unmistakably
    # synthetic and no real sanctioned individual's name appears in this repository.
    screening_positive_share: 0.0014

  fraud:
    # Spec 003 section 4 requires between 0.05 and 0.15 percent of card transactions to be
    # fraudulent. The target sits mid-band so that sampling noise at dev does not push the
    # measured rate outside it.
    target_rate: 0.0010
    # Fraud concentrates rather than spreading evenly. These are relative propensity
    # multipliers, applied and then normalised to hit target_rate.
    card_not_present_multiplier: 7.5
    unfamiliar_merchant_multiplier: 3.2
    night_hour_multiplier: 2.8
    night_hours: [0, 1, 2, 3, 4]
    velocity_burst_multiplier: 4.4
    velocity_burst_length: 5
    new_device_multiplier: 3.9
    # The prevalence of each risk context, used to calibrate the per-transaction fraud
    # probability analytically so that the multipliers above concentrate fraud without also
    # changing how much of it there is. Raising a multiplier moves where fraud falls; only
    # target_rate moves how much.
    unfamiliar_merchant_share: 0.22
    velocity_burst_share: 0.018
    # Derived rather than chosen: digital.new_device_monthly_hazard (0.028) times the digital
    # share of card_purchase channels (ecommerce 0.281 plus mobile_app 0.196). Stated as a
    # parameter because the calibration reads it, and kept in step by the realism document.
    new_device_context_share: 0.014
    # Detection is imperfect in both directions, which is the whole point: a detector that
    # fires on exactly the fraudulent transactions makes Q10 report 100 percent precision and
    # measure nothing.
    # Recall is configured here and asserted by unit test, and it is deliberately not a
    # contract band. It cannot be measured from the loaded database, because its
    # denominator is all fraud — including fraud nobody ever detected or reported — and
    # the database stores only alerts and their dispositions, which is what a bank has.
    # See the alert performance entry in docs/metric_definitions.md.
    detection_recall: 0.62
    false_alert_rate: 0.00042
    # Alert scores. Confirmed fraud scores higher on average but the distributions overlap,
    # because a detector whose score separates the classes perfectly is the same fake.
    score_fraud_alpha: 6.0
    score_fraud_beta: 2.4
    score_legit_alpha: 2.6
    score_legit_beta: 4.2
    # Dispositions arrive days after the alert, which is what makes precision a moving measure
    # and why metric_definitions.md attributes by disposition month.
    disposition_lag_days_min: 1
    disposition_lag_days_max: 14
    # Alerts still open at the anchor are the pending backlog.
    open_share: 0.055
    escalated_share: 0.021
    investigating_share: 0.026
    analyst_reference_share: 0.94
    rule_mix:
      velocity_card: 0.213
      high_value_cnp: 0.198
      new_device_high_value: 0.163
      geo_impossible: 0.121
      merchant_risk: 0.118
      dormant_reactivation: 0.106
      structuring_cash: 0.081

  lending:
    # Applications per customer per year.
    applications_per_customer_year: 0.19
    product_mix:
      personal_24: 0.263
      personal_12: 0.198
      personal_60: 0.171
      auto_48: 0.157
      home_improve_36: 0.132
      business_24: 0.079
    # Approval rate varies by risk band, which is what Q8 measures.
    approval_rate_by_band:
      A: 0.93
      B: 0.84
      C: 0.68
      D: 0.44
      E: 0.17
    # Not every decided application is approved or rejected: some are withdrawn or expire, and
    # metric_definitions.md excludes both from the approval rate and reports them beside it.
    withdrawn_share: 0.041
    expired_share: 0.028
    # An application in flight at the anchor has not been decided yet.
    undecided_share: 0.023
    referred_share: 0.048
    decision_lag_hours_min: 2
    decision_lag_hours_max: 216
    # Money leaving the bank is what starts the risk, so disbursement lags the decision.
    disbursement_lag_days_min: 1
    disbursement_lag_days_max: 21
    # An approved application is not always drawn down.
    disbursement_share: 0.91
    # The approved amount is at most the requested amount and often less.
    approved_amount_haircut_choices: [1.00, 1.00, 1.00, 0.90, 0.80, 0.75, 0.60, 0.50]
    requested_amount_mu: 8.9
    requested_amount_sigma: 0.78
    requested_amount_min: 500
    requested_amount_max: 75000
    term_months_choices: [12, 24, 36, 48, 60, 72, 84]
    term_months_weights: [0.09, 0.19, 0.27, 0.19, 0.15, 0.07, 0.04]
    # Lifetime probability of default by risk band, consistent with the pd bounds on
    # ref.risk_bands so that Q8 can compare realised default against the band it was written
    # for. Each sits inside its band's stated interval.
    default_rate_by_band:
      A: 0.004
      B: 0.011
      C: 0.029
      D: 0.072
      E: 0.164
    # Delinquency emerges over the months after origination rather than immediately, so Q7's
    # vintage curves have shape. This is the share of a loan's lifetime default hazard that has
    # materialised by month N, as a seasoning curve.
    seasoning_curve:
      [0.00, 0.01, 0.03, 0.07, 0.12, 0.18, 0.25, 0.33, 0.41, 0.49, 0.57, 0.64,
       0.70, 0.76, 0.81, 0.85, 0.89, 0.92, 0.94, 0.96, 0.97, 0.98, 0.99, 1.00]
    # A borrower who falls behind may catch up. Cures are visible as a fall in the rate rather
    # than as a retrospective edit, per metric_definitions.md.
    cure_rate: 0.38
    # Late but not delinquent: paid after the due date, inside the same cycle.
    late_payment_share: 0.094
    late_payment_days_max: 24
    # A defaulted loan is written off after this long in default.
    write_off_months: 6
    write_off_share: 0.58
    restructured_share: 0.031

  attrition:
    # Monthly hazard of an account closing, so Q2's retention curve decays rather than sits
    # flat. Higher in the first year, as real attrition is.
    monthly_close_hazard_first_year: 0.0118
    monthly_close_hazard_thereafter: 0.0044
    # Dormancy is not closure: the account stays open and stops moving.
    monthly_dormancy_hazard: 0.0075
    dormancy_reactivation_hazard: 0.021
    # A customer with no open account is soft deleted, which is the path silver's delete
    # handling needs to see.
    customer_delete_share_of_closed: 0.16
    frozen_share: 0.004

  digital:
    # Background sessions: the customer opening the app without transacting. Sessions that
    # precede a digital transaction are generated in addition to these, so the total per
    # customer is higher than this number and is reported measured.
    background_sessions_per_customer_month: 6.5
    sessions_dispersion: 0.62
    channel_mix:
      mobile_app: 0.781
      web: 0.197
      api: 0.022
    outcome_mix:
      success: 0.934
      failed_password: 0.043
      failed_mfa: 0.014
      locked: 0.005
      expired: 0.004
    # A stable device per customer plus occasional new ones. Q19 measures the share of activity
    # from a device unseen in the trailing 90 days, so this is the signal it reads.
    devices_per_customer_weights:
      1: 0.58
      2: 0.29
      3: 0.10
      4: 0.03
    new_device_monthly_hazard: 0.028
    session_minutes_mu: 1.64
    session_minutes_sigma: 0.82
    # An unclosed session has a null ended_at.
    unclosed_share: 0.017
    # ip_country_code usually matches residence; travel and VPNs do not.
    ip_country_matches_residence: 0.938
    ip_country_null_share: 0.006
    # Spec 003 invariant 13, as replaced: the share of customer-initiated digital-channel
    # transactions that are preceded by a login for the same customer within 24 hours. It is a
    # generator target and the invariant asserts the floor in `bands`.
    login_precedes_transaction_share: 0.87

  # Spec 004: what a tick changes, as distinct from what the history contains.
  #
  # Volumes are deliberately not restated here. A tick draws the day's movements from the same
  # per-account rates as the historical load, divided by the length of the simulated month and
  # carrying the same seasonality, weekend factor and growth trend, so the day after the anchor
  # looks like the day before it. Only the things the history has no analogue of carry
  # parameters of their own, and they are below.
  mutation:

    late_arrival:
      # Offline card authorisations: transit gates, in-flight sales, unattended terminals that
      # take a transaction without an online authorisation and present it days later. The bank
      # learns of it after the fact and so cannot decline it, which is the point rather than a
      # side effect: this is the only mechanism in the source that can leave an account past
      # its overdraft limit, and the loaded ci book contains no such account at all.
      # Share of a day's card purchases.
      offline_card_share: 0.009
      # Spec 004 section 1 states two to five days.
      lag_days_min: 2
      lag_days_max: 5
      # Weighted towards the shorter lags: most offline files present at the next clearing
      # cycle, and five days is a weekend with a holiday on the end of it.
      lag_day_weights: [0.44, 0.29, 0.17, 0.10]

    deferred_posting:
      # An authorisation older than this is stale and never posts. Without the bound a tick
      # would drain the historical book's whole standing backlog over its first few days, which
      # is a spike rather than a steady state: 298 of the 378 non-posted transactions in the
      # loaded ci book are more than thirty days old, and a real system would not clear those
      # either.
      max_age_days: 7
      # Daily hazard that an in-flight row crosses into its next status. A hazard rather than a
      # share of the backlog, so that time to clear is a property of the row's own age and the
      # backlog settles at its own equilibrium against the rate new rows arrive.
      transaction_posts: 0.38
      payment_books: 0.42
      # booked to settled moves no money, because both are is_posted. It is the largest single
      # source of divergence between business time and audit time for silver to order, and it
      # costs the balance nothing.
      payment_settles: 0.55

    dirt:
      # What a well-constrained OLTP system still emits. Spec 004 section 2 argues the case: an
      # orphan in `core` is not something this generator declines to produce, it is something
      # the source cannot express, so genuine schema and type violations belong to the file and
      # API feeds at M4.
      #
      # A second record for the same person, entered under a name one edit away. The most
      # valuable item here, because it gives silver a real entity-resolution problem rather than
      # a demonstration of one. Per existing customer per day.
      duplicate_customer_daily_share: 0.0008
      # Casing and stray whitespace in a free-text field. Nothing in a varchar rejects
      # " jan  KOWALSKI" and nothing should.
      text_dirt_daily_share: 0.0004
      # A KYC status the account behind it contradicts: the review lapsed and nobody froze the
      # account the same day. Every value is legal and the combination is wrong in a way only a
      # business rule can see, which replaces the income band inconsistent with occupation that
      # spec 004 named — neither of those columns exists.
      lapsed_kyc_daily_share: 0.0003
      # A nullable column left null where the business expects a value: a bounced email removed
      # and never replaced.
      cleared_contact_daily_share: 0.0002

    deletes:
      # A duplicate is found and dealt with. The candidate set is customers with no dependent
      # row of any kind, which the loaded ci book contains none of, so it is an exact
      # description of a duplicate the dirt phase created and nothing has attached to.
      duplicate_resolution_daily_hazard: 0.08
      # Of those, the share purged outright rather than tombstoned. Small, because most systems
      # tombstone — and it exists at all because M7's primary-key reconciler needs one real
      # instance of the condition it is written to detect.
      physical_purge_share: 0.15
      # Authorisations and declines a back office voids. None of them ever moved money: a
      # posted transaction is reversed rather than deleted, because invariant 4 filters on
      # is_posted and not on is_deleted.
      void_transaction_daily_hazard: 0.004
      void_max_age_days: 30
      # Applications the funnel finished with and no loan was drawn against.
      clear_application_daily_hazard: 0.01

    lifecycle:
      # Account status transitions reuse the monthly hazards in `attrition`, divided by the
      # length of the simulated month, so the tick and the historical load move accounts at one
      # rate rather than at two that happen to look alike. These are the ones the history has no
      # analogue of.
      #
      # Terms change rarely. An overdraft limit is reviewed at a renewal or on request, not
      # monthly.
      overdraft_limit_change_monthly_hazard: 0.004
      # Cards are blocked on a suspected compromise or a customer's call, which is rare per card
      # per month but adds up across a book.
      card_block_monthly_hazard: 0.006
      # A blocked card does not stay blocked: the customer calls, the card is superseded and a
      # replacement goes out within a few days. A daily hazard because the clock starts at the
      # block rather than at the month.
      blocked_card_replacement_daily_hazard: 0.22
      # A current account left with no usable card gets one. This is also what heals the
      # accounts the historical book leaves carrying nothing but a blocked, cancelled or
      # replaced card.
      card_reissue_monthly_hazard: 0.35
      # Customer attributes. One of the four changes on a given day, drawn from their combined
      # hazard, because four independent draws would sometimes pick the same customer twice and
      # the tick log counts distinct rows. Risk and KYC move on review cycles, contact details
      # when the customer updates them, and a surname on a marriage or a deed poll — which is
      # the rarest of the four by two orders of magnitude and is what makes fuzzy matching at
      # M5 non-trivial.
      customer_risk_band_monthly_hazard: 0.008
      customer_kyc_monthly_hazard: 0.011
      customer_contact_monthly_hazard: 0.019
      customer_surname_monthly_hazard: 0.0012
      # A move. The old address is closed the day before the new one starts, so a point-in-time
      # lookup has exactly one answer.
      address_change_monthly_hazard: 0.007
      # Acquirer risk score revisions on core.merchants, which only exist once the scripted
      # drift event has added the column. An unscored merchant is scored for the first time far
      # more readily than a scored one is revised, so the phase multiplies this for a null.
      merchant_risk_score_monthly_hazard: 0.06

    reversal:
      # A posted transaction is reversed rather than soft deleted (spec 004, amended). The
      # reversal is its own movement with its own ledger entries, which is what a real ledger
      # does, and it leaves invariant 4 exact on both rows rather than forcing a choice between
      # a wrong balance and a source that says money moved when silver says it did not.
      share_of_recent_postings: 0.0011
      max_age_days: 5

  ledger:
    # Whole balanced batches per COPY transaction. Measured against the deferred constraint
    # trigger's queue, which does not spill to disk, inside the 512 MiB container limit. ADR
    # 0009 measured 100k entry rows; spec 003 re-measured and ADR 0011 records the result.
    entry_rows_per_transaction: 100000
    # Batch sizes the generator emits, by source event. Two lines is the ordinary case; the
    # multi-currency and fee-bearing paths post more.
    # The chart of accounts the postings use, from ref.gl_accounts. Named here rather than
    # inline so a reader can see the whole posting model in one place.
    accounts:
      cash: "1000"                 # Cash and balances at central banks, asset
      loans_advances: "1100"       # Loans and advances to customers, asset
      customer_deposits: "2000"    # Customer deposits, liability
      interest_income: "4000"
      fee_income: "4100"
      interchange_income: "4200"
      fx_income: "4300"
      interest_expense: "5000"
      suspense: "9000"
      fx_conversion: "9100"

  loading:
    # Rows per COPY statement for the ordinary tables, which bounds the payload held in memory
    # on both sides of the pipe rather than the trigger queue.
    copy_chunk_rows: 250000
    # Foreign keys are dropped for the duration of the load and revalidated afterwards, on the
    # measurement in ADR 0011. Secondary indexes are not: dropping them was measured and is not
    # worth it.
    drop_foreign_keys_during_load: true
    drop_secondary_indexes_during_load: false

  # Contract bands. These are what spec 003's invariants and acceptance criteria assert, and
  # they are restated in docs/generator_realism.md for review. `make docs-check` fails if the
  # two disagree, so neither is maintained by hand against the other.
  #
  # Every entry here is restated in the table under "Contract bands" in
  # docs/generator_realism.md, and check_docs.py compares the two.
  bands:
    fraud_rate: {min: 0.0005, max: 0.0015}
    alert_precision: {min: 0.42, max: 0.78}
    confirmed_fraud_rate_among_alerts: {min: 0.42, max: 0.78}
    approval_rate_overall: {min: 0.55, max: 0.78}
    # Observed default at the anchor, not lifetime default. They are different numbers and
    # the first is always the smaller: a loan book contains vintages that have not
    # seasoned, and a loan whose default month falls after the anchor has not defaulted.
    # Measured 0.0094 at dev against lifetime rates of 0.004 to 0.164 by band.
    default_rate_overall: {min: 0.004, max: 0.075}
    login_precedes_transaction_share: {min: 0.80, max: 0.95}
    non_eea_merchant_share: {min: 0.02, max: 0.07}
    card_not_present_share: {min: 0.28, max: 0.56}
    # Chi-square critical value at 8 degrees of freedom, p = 0.001. The tolerance is a
    # statistic rather than a percentage so that the check is honest at every scale instead of
    # vacuous at one and flaky at another. Asserted on card purchase amounts only: cash
    # rounding and repeated recurring amounts are anti-Benford by construction, and the amount
    # model wins over the demonstration. See docs/generator_realism.md.
    # Nigrini's mean absolute deviation between the observed first-digit shares and
    # Benford's. 0.006 is his threshold for close conformity.
    #
    # This replaces the chi-square critical value the ruling asked for, and the reason is
    # measured rather than argued: chi-square tests significance, not effect size, and
    # its power grows with the sample. A fixed critical value is therefore stricter at a
    # larger profile, which is the opposite of the scale-invariance it was chosen for.
    # The ci run measured a deviation of 0.00577 — close conformity — against a
    # chi-square of 80.5 on 23,437 amounts, and the same distribution at dev would
    # produce a chi-square around sixty times larger for no reason but the row count.
    # The chi-square statistic is still computed and reported beside the deviation.
    benford_mad_max: 0.006

profiles:

  ci:
    customers: 500
    history_months: 6
    # Invariant 9's statistical band is not asserted at this scale. A fraud rate of one in a
    # thousand over tens of thousands of card transactions yields a few dozen events, and a
    # band wide enough to be honest at that n asserts nothing. The invariant checks structural
    # properties only and reports the n and the interval width that justify the suspension.
    assert_statistical_bands: false

  dev:
    customers: 5000
    history_months: 36
    assert_statistical_bands: true

  # full exists to prove that incremental beats full refresh and to exercise the
  # single-writer constraint under load. Thirty thousand customers over five years
  # demonstrates both as well as a quarter of a million would, and lands on the tens of
  # millions of transactions the specification asks for.
  #
  # The customer count is what moves, not the per-customer intensity. Intensity is a
  # validated realism parameter: lowering it to hit a row count would make the full
  # profile a less realistic bank than the dev profile, which is the opposite of what a
  # larger profile is for.
  full:
    customers: 30000
    history_months: 60
    assert_statistical_bands: true
