[project]
name = "nordbank-data-platform"
version = "0.1.0"
description = "Medallion-architecture data platform for a simulated EU neobank: Airflow, dbt, DuckDB, Power BI."
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "sqlfluff>=4.3.0",
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH"]
