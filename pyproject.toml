[project]
name = "nordbank-data-platform"
version = "0.1.0"
description = "Medallion-architecture data platform for a simulated EU neobank: Airflow, dbt, DuckDB, Power BI."
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0.3",
    # The mutation engine reaches postgres-source directly, because a tick is one transaction
    # and a driver gives a real rollback where a pipe gives a sentinel protocol. Measured
    # against psql in ADR 0012. Already present in the Airflow image at 3.3.5, so the DAG
    # needs no image change.
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "sqlfluff>=4.3.0",
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "duckdb==1.5.5",
    # duckdb's Python API needs pytz to bind a timezone-aware datetime to a timestamptz
    # column, and every timestamp in this platform is timezone-aware (conventions.md). The
    # Airflow image already carries it, so this is the host half of a dependency the container
    # half already has; without it the registry unit tests cannot bind a watermark.
    "pytz>=2025.2",
    # The extraction path writes Parquet with PyArrow and reaches MinIO with boto3, and both
    # are in the Airflow image, where extraction runs. They are here because the unit tests
    # exercise the Parquet writer and the lake client on the host, in `make test`, which needs
    # neither Airflow nor a running stack.
    "pyarrow>=21.0.0",
    "boto3>=1.40.0",
]
# Airflow is a separate group: it does not import on every host this project is developed on,
# so `uv sync` must not put a broken installation in the default environment. CI installs it
# on Linux to run the DAG integrity tests.
airflow = [
    "apache-airflow==3.3.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH"]

[tool.pytest.ini_options]
testpaths = ["airflow/tests", "generator/tests"]
markers = [
    "dags: needs an Airflow installation to import the DAG files",
    "integration: needs a running stack",
]
